<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc"><title id="title">图层</title><desc id="desc">多层画面分离后重新叠合。原创功能原理示意，点击阅读对应的中文文档。</desc><metadata>{&quot;id&quot;:&quot;layer-detail&quot;,&quot;sourceReferences&quot;:[{&quot;kind&quot;:&quot;original-vector-principle&quot;,&quot;path&quot;:&quot;components/home/landing/hero-wall-art.mjs&quot;,&quot;attribution&quot;:&quot;duik-zh original motion illustration&quot;,&quot;note&quot;:&quot;原创动态几何插画；不是 AE 面板、Duik 算法或实际执行结果。&quot;,&quot;sha256&quot;:&quot;e46ab9a1c113e1c8dad41e19eea8608b8b193ae9bc3ba8059660271c926a1274&quot;,&quot;meaning&quot;:&quot;多层画面分离后重新叠合&quot;}]}</metadata><path fill="#dfbb81" d="M0 0H800V800H0Z"/><style>@media(prefers-reduced-motion:no-preference){.sheet-back{transform:translate(-20px,-45px)}.sheet-front{transform:translate(20px,-95px)}@keyframes sheet-back{0%,100%{transform:translate(0,0)}45%,65%{transform:translate(-35px,-75px)}}.sheet-back{animation:sheet-back 7s cubic-bezier(.77,0,.175,1) 0s infinite}@keyframes sheet-front{0%,100%{transform:translate(0,0)}45%,65%{transform:translate(35px,-160px)}}.sheet-front{animation:sheet-front 7s cubic-bezier(.77,0,.175,1) 0s infinite}}</style><g transform="rotate(-25 400 400) skewY(10)"><rect x="145" y="180" width="510" height="440" rx="14" fill="#374a3b" /><g class="sheet-back" ><rect x="145" y="180" width="510" height="440" rx="14" fill="#798569" /></g><g class="sheet-front" ><rect x="145" y="180" width="510" height="440" rx="14" fill="#fbfaf5" /><circle cx="400" cy="400" r="140" fill="#bd582f" /><circle cx="400" cy="400" r="57" fill="#dfbb81" /></g></g></svg>